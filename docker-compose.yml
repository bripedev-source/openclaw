services:
  # ─── Docker Socket Proxy ─────────────────────────────────────────────────────
  # Sits between openclaw and the host Docker daemon.
  # openclaw connects to this proxy instead of /var/run/docker.sock directly.
  # Only the specific API endpoints openclaw needs are enabled — everything else
  # is blocked, so even if openclaw is compromised it cannot escape to the host.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      # Read access (needed to inspect running containers/images)
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      # Write access (needed to spawn agent sandboxes)
      EXEC: 1
      POST: 1
      # Everything else is off by default (NETWORKS, VOLUMES, SWARM, etc.)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal
    # No host ports — only reachable by openclaw inside the internal network

    # ─── OpenClaw Gateway ────────────────────────────────────────────────────────
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    build:
      context: .
    # Runs as the 'node' user (uid 1000) defined in the Dockerfile — never root
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-ollama}
      ZAI_API_KEY: ${ZAI_API_KEY}
      NOTION_API_KEY: ${NOTION_API_KEY}
      SAG_API_KEY: ${SAG_API_KEY}
      NANO_BANANA_API_KEY: ${NANO_BANANA_API_KEY}
      TELEGRAM_HEARTBEAT_DESTINATION: ${TELEGRAM_HEARTBEAT_DESTINATION}
      LOG_LEVEL: debug
      # Point Docker client to the socket proxy instead of the host socket
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
      # Docker socket removed — access via proxy above
    ports:
      - "127.0.0.1:18789:18789"
      - "127.0.0.1:18790:18790"
    # ── Sandbox hardening ──────────────────────────────────────────────────────
    read_only: true # Container filesystem is immutable
    tmpfs:
      - /tmp:size=256m,mode=1777 # RAM-only scratch space
      - /home/node/.npm:size=64m # npm cache in RAM
    security_opt:
      - no-new-privileges:true # Prevent setuid privilege escalation
    cap_drop:
      - ALL # Drop every Linux capability...
    cap_add:
      - NET_BIND_SERVICE # ...re-add only port binding
    # ──────────────────────────────────────────────────────────────────────────
    init: true
    restart: unless-stopped
    depends_on:
      - ollama
      - docker-socket-proxy
    networks:
      - internal
      - external
    command: [ "node", "dist/index.js", "gateway", "--bind", "${OPENCLAW_GATEWAY_BIND:-lan}", "--port", "18789" ]

  # ─── Ollama (local LLM) ──────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    restart: unless-stopped
    networks:
      - internal

  # ─── DuckDuckGo MCP ──────────────────────────────────────────────────────────
  mcp-duckduckgo:
    image: node:20-alpine
    command: tail -f /dev/null
    init: true
    restart: unless-stopped
    networks:
      - internal

  # ─── OpenClaw CLI (interactive) ──────────────────────────────────────────────
  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      BROWSER: echo
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-ollama}
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/node/.npm:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    stdin_open: true
    tty: true
    init: true
    depends_on:
      - docker-socket-proxy
    networks:
      - internal
    entrypoint: [ "node", "dist/index.js" ]

volumes:
  ollama-data:


networks:
  # Internal network — services talk to each other here, not exposed to host
  internal:
    driver: bridge
    internal: false # set to true if you want to fully block internet access from containers
  # External network — only gateway gets internet access
  external:
    driver: bridge
